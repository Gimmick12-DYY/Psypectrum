# conda env create -f environment.yml && conda activate psypectrum
# GPU PyTorch: pip wheels target recent GPUs (sm_70+). GTX 1080 (Longleaf "gpu" partition) needs an older build or use volta-gpu / A100 / L40 instead.
# Optional HF Hub auth: export HF_TOKEN=...  (higher rate limits)

name: psypectrum
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
    - torch>=2.0
    - transformers>=4.30
    - datasets>=2.14
